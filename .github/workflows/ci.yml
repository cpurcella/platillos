name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm audit
      - name: Scan Git history for secrets
        shell: bash
        run: |
          scan_dir=$(mktemp -d)
          cd "$scan_dir"
          release=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --silent --show-error --location "$release/gitleaks_8.30.1_linux_x64.tar.gz" --output gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location "$release/gitleaks_8.30.1_checksums.txt" --output checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --redact --log-opts=--all
